<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Reseller">
<meta name="theme-color" content="#0e0e10">
<title>Reseller</title>
<style>
:root{color-scheme:dark;--bg:#0e0e10;--card:#17171a;--ink:#ece7dc;--sub:#85827b;--ac:#c9a86a;--gr:#7fbf9a;--rd:#d67c6e;--bd:#26262a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:15px -apple-system,"Helvetica Neue",Arial,sans-serif;padding:calc(14px + env(safe-area-inset-top)) 16px calc(100px + env(safe-area-inset-bottom))}
h1{font:400 24px Georgia,"Times New Roman",serif;text-transform:uppercase;letter-spacing:4px;margin:6px 0 16px}
h1 span{color:var(--ac)}
h2{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:2.5px;color:var(--ac);margin:26px 0 10px}
small{display:block;color:var(--sub);font-size:10px;text-transform:uppercase;letter-spacing:1.2px}
.chips{display:flex;gap:6px;overflow-x:auto;margin-bottom:14px}
.chips button{flex:1;white-space:nowrap;padding:8px 10px;border:1px solid var(--bd);border-radius:20px;background:none;color:var(--sub);font-size:13px;font-weight:500}
.chips button.on{border-color:var(--ac);color:var(--ac);background:rgba(201,168,106,.1)}
.hero,.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.t{background:linear-gradient(160deg,#1d1d21,#141417);border:1px solid var(--bd);border-radius:16px;padding:14px}
.hero .t{border-color:rgba(201,168,106,.3)}
.t b{display:block;font:400 24px Georgia,"Times New Roman",serif;margin-top:4px}
.grid{margin-top:10px}.grid .t b{font-size:17px}
.neg{color:var(--rd)}.pos{color:var(--gr)}
.row{display:flex;justify-content:space-between;align-items:center;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px 14px;margin-bottom:8px}
.row small{text-transform:none;letter-spacing:0;font-size:12px;margin-top:3px}
.row>span{font-weight:600;white-space:nowrap;margin-left:8px}
table{width:100%;border-collapse:collapse;font-size:12px;background:var(--card);border:1px solid var(--bd);border-radius:14px;overflow:hidden}
th{text-align:left;color:var(--ac);font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:1px;padding:10px 4px}
td{padding:10px 4px;border-top:1px solid var(--bd);vertical-align:top}
td:nth-child(n+2){white-space:nowrap}
th:first-child,td:first-child{padding-left:12px}
tr[data-e]{cursor:pointer}
.e{color:var(--sub);text-align:center;padding:14px 0;font-size:13px}
.btn{width:100%;padding:14px;border-radius:14px;border:1px solid var(--bd);background:var(--card);color:var(--ink);font-size:15px;font-weight:600;margin-top:4px}
.btn.pri{background:var(--ac);border-color:var(--ac);color:#14110b}
.btn.del{color:var(--rd);border-color:var(--rd);background:none}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:rgba(23,23,26,.92);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;padding:12px 0 10px;border:0;background:none;color:var(--sub);font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:1px}
nav button.on{color:var(--ac)}
nav i{display:block;font-style:normal;font-size:19px;margin-bottom:2px}
#fab{position:fixed;right:16px;bottom:calc(76px + env(safe-area-inset-bottom));background:var(--ac);color:#14110b;border:0;border-radius:30px;padding:14px 22px;font-size:14px;font-weight:700;letter-spacing:.3px;box-shadow:0 8px 24px rgba(0,0,0,.6)}
#m{display:none;position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:9;align-items:flex-end}
#m.show{display:flex}
.sheet{width:100%;background:var(--card);border-top:1px solid var(--bd);border-radius:22px 22px 0 0;padding:20px 16px calc(18px + env(safe-area-inset-bottom));max-height:90%;overflow:auto}
.sheet h2{margin-top:0}
label{display:block;font-size:11px;color:var(--sub);text-transform:uppercase;letter-spacing:1.2px;margin-bottom:12px}
input{display:block;width:100%;margin-top:6px;padding:13px;font-size:17px;border-radius:12px;border:1px solid var(--bd);background:var(--bg);color:var(--ink);outline:none}
input:focus{border-color:var(--ac)}
#pv{min-height:22px;font-weight:600;margin:2px 0 12px}
.acts{display:flex;gap:8px}
#toast{position:fixed;top:calc(12px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:var(--ac);color:#14110b;padding:9px 16px;border-radius:20px;font-size:13px;font-weight:600;z-index:20;display:none}
svg{width:100%;background:var(--card);border:1px solid var(--bd);border-radius:14px}
svg text{fill:var(--sub);font-size:10px;text-anchor:middle}
</style>
</head>
<body>
<div id="app"></div>
<button id="fab">+ Artikel hinzufügen</button>
<nav>
<button data-t="home"><i>◼</i>Start</button>
<button data-t="items"><i>☰</i>Artikel</button>
<button data-t="costs"><i>€</i>Kosten</button>
<button data-t="stats"><i>▮</i>Statistik</button>
</nav>
<div id="m"></div><div id="toast"></div>
<script>
const K='reseller_v1',$=s=>document.querySelector(s);
let D;try{D=JSON.parse(localStorage.getItem(K))}catch(e){}
D=D||{items:[],costs:[]};
let per='month',tab='home';
const save=()=>{try{localStorage.setItem(K,JSON.stringify(D))}catch(e){toast('Speichern nicht möglich!')}};
const toast=t=>{const x=$('#toast');x.textContent=t;x.style.display='block';setTimeout(()=>x.style.display='none',2000)};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const eur=n=>n.toLocaleString('de-DE',{minimumFractionDigits:n%1?2:0,maximumFractionDigits:2})+' €';
const iso=d=>new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
const today=()=>iso(new Date());
const dm=s=>s.split('-').reverse().join('.');
const sum=(a,k)=>a.reduce((s,x)=>s+x[k],0);
const sg=p=>(p>=0?'+':'')+eur(p);
function inR(s){
  const t=today();
  if(per=='all')return true;
  if(per=='day')return s==t;
  if(per=='month')return s.slice(0,7)==t.slice(0,7);
  if(per=='year')return s.slice(0,4)==t.slice(0,4);
  const d=new Date();d.setDate(d.getDate()-(d.getDay()+6)%7);
  return s>=iso(d)&&s<=t;
}
function calc(){
  const it=D.items.filter(i=>inR(i.date)),co=D.costs.filter(c=>inR(c.date));
  const um=sum(it,'sell'),ek=sum(it,'buy'),fx=sum(co,'amt'),n=it.length,g=um-ek-fx;
  return{um,ek,fx,n,g,ag:n?(um-ek)/n:0,av:n?um/n:0,m:um?g/um*100:0};
}
const sorted=()=>[...D.items].sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id);
const tile=(l,v,c='')=>`<div class=t><small>${l}</small><b class="${c}">${v}</b></div>`;
const row=i=>{const p=i.sell-i.buy;return `<div class=row data-e="${i.id}"><div><b>${esc(i.name)}</b><small>${dm(i.date)} · ${eur(i.buy)} → ${eur(i.sell)}</small></div><span class="${p<0?'neg':'pos'}">${sg(p)}</span></div>`};

function home(){
  const s=calc(),P=[['day','Heute'],['week','Woche'],['month','Monat'],['year','Jahr'],['all','Gesamt']];
  const r=sorted().slice(0,6).map(row).join('')||'<p class=e>Tippe unten auf „+ Artikel hinzufügen“</p>';
  return `<h1>Reseller<span>.</span></h1>
  <div class=chips>${P.map(([k,l])=>`<button data-p=${k} class="${per==k?'on':''}">${l}</button>`).join('')}</div>
  <div class=hero>${tile('Umsatz',eur(s.um))}${tile('Gewinn',eur(s.g),s.g<0?'neg':'')}${tile('Verkäufe',s.n)}${tile('Ø Gewinn',eur(s.ag))}</div>
  <div class=grid>${tile('Einkaufskosten',eur(s.ek))}${tile('Fixkosten & Gebühren',eur(s.fx))}${tile('Ø Verkaufspreis',eur(s.av))}${tile('Gewinnmarge',s.m.toFixed(1).replace('.',',')+' %')}</div>
  <h2>Zuletzt verkauft</h2>${r}`;
}
function items(){
  const l=sorted();
  return `<h1>Artikel</h1>`+(l.length?`<table><tr><th>Artikel<th>Einkauf<th>Verkauf<th>Gewinn<th>Datum</tr>${l.map(i=>{const p=i.sell-i.buy;return `<tr data-e="${i.id}"><td>${esc(i.name)}<td>${eur(i.buy)}<td>${eur(i.sell)}<td class="${p<0?'neg':'pos'}">${sg(p)}<td>${dm(i.date)}</tr>`}).join('')}</table><p class=e>Zeile antippen = bearbeiten oder löschen</p>`:'<p class=e>Noch keine Artikel</p>');
}
function costs(){
  const l=t=>D.costs.filter(c=>c.t==t).sort((a,b)=>b.date.localeCompare(a.date)).map(c=>`<div class=row data-c="${c.id}"><div><b>${esc(c.name)}</b><small>${dm(c.date)}</small></div><span class=neg>−${eur(c.amt)}</span></div>`).join('')||'<p class=e>Noch nichts eingetragen</p>';
  return `<h1>Kosten</h1><h2>Fixkosten</h2>${l('fix')}<button class=btn data-add=fix>+ Fixkosten</button>
  <h2>Einmalige Gebühr</h2>${l('once')}<button class=btn data-add=once>+ Einmalige Gebühr</button>
  <h2>Backup</h2><button class=btn data-x=1>⬇ Als CSV exportieren</button>
  <p class=e>Alle Daten liegen nur auf diesem Gerät. Mach ab und zu ein Backup.</p>`;
}
function chart(title,a,f,col){
  const W=320,H=140,top=18,bot=H-22,bw=W/a.length,mx=Math.max(...a.map(x=>Math.abs(x.v)),1);
  const neg=a.some(x=>x.v<0),y0=neg?top+(bot-top)*.65:bot,sc=Math.min(y0-top,neg?bot-y0:1e9)/mx;
  return `<h2>${title}</h2><svg viewBox="0 0 ${W} ${H}"><line x1=0 x2=${W} y1=${y0} y2=${y0} stroke="var(--bd)"/>${a.map((x,i)=>{
    const h=Math.abs(x.v)*sc,y=x.v>=0?y0-h:y0,cx=i*bw+bw/2;
    return `<rect x=${i*bw+bw*.2} y=${y} width=${bw*.6} height=${h} rx=3 fill="${x.v<0?'var(--rd)':col}"/><text x=${cx} y=${x.v>=0?y0-h-4:y0+h+11}>${f(x.v)}</text><text x=${cx} y=${H-6}>${x.l}</text>`}).join('')}</svg>`;
}
function stats(){
  const m={},g=k=>m[k]||(m[k]={um:0,g:0,n:0});
  D.items.forEach(i=>{const a=g(i.date.slice(0,7));a.um+=i.sell;a.g+=i.sell-i.buy;a.n++});
  D.costs.forEach(c=>g(c.date.slice(0,7)).g-=c.amt);
  const ks=Object.keys(m).sort().slice(-6);
  if(!ks.length)return '<h1>Statistik</h1><p class=e>Noch keine Daten</p>';
  const A=f=>ks.map(k=>({l:k.slice(5)+'/'+k.slice(2,4),v:m[k][f]})),r=v=>Math.round(v)+'€';
  return `<h1>Statistik</h1>${chart('Umsatz pro Monat',A('um'),r,'var(--ink)')}${chart('Gewinn pro Monat (nach Kosten)',A('g'),r,'var(--gr)')}${chart('Verkäufe pro Monat',A('n'),v=>v,'var(--ac)')}`;
}
function render(){
  $('#app').innerHTML={home,items,costs,stats}[tab]();
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t==tab));
}
const close=()=>$('#m').classList.remove('show');
function modal(kind,o){
  o=o||{};
  const F={item:[['name','Artikelname','t'],['buy','Einkaufspreis €','n'],['sell','Verkaufspreis €','n']],
    fix:[['name','Name (z. B. Verpackung)','t'],['amt','Betrag €','n'],['date','Datum','d']],
    once:[['name','Name (z. B. Startgebühr)','t'],['amt','Betrag €','n']]}[kind];
  $('#m').innerHTML=`<div class=sheet><h2>${o.id?'Bearbeiten':'Neuer Eintrag'}</h2>${F.map(([k,l,ty])=>`<label>${l}<input id=f_${k} type=${ty=='d'?'date':'text'} ${ty=='n'?'inputmode=decimal':''} value="${o[k]!=null?esc(String(o[k]).replace(/(\d)\.(\d)/,'$1,$2')):ty=='d'?today():''}"></label>`).join('')}<div id=pv></div>
  <div class=acts>${o.id?'<button class="btn del" id=del>Löschen</button>':''}<button class=btn id=cancel>Abbrechen</button><button class="btn pri" id=ok>Speichern</button></div></div>`;
  $('#m').classList.add('show');
  const num=id=>parseFloat(($('#'+id).value||'').replace(',','.'));
  const pv=()=>{if(kind!='item')return;const b=num('f_buy'),s=num('f_sell');
    $('#pv').innerHTML=(isNaN(b)||isNaN(s))?'':`Gewinn: <span class="${s-b<0?'neg':'pos'}">${sg(s-b)}</span> · Marge: ${s?((s-b)/s*100).toFixed(1).replace('.',','):0} %`};
  $('.sheet').oninput=pv;pv();
  if(!o.id)setTimeout(()=>$('#f_name').focus(),50);
  $('#cancel').onclick=close;
  if(o.id)$('#del').onclick=()=>{if(!confirm('Wirklich löschen?'))return;
    D.items=D.items.filter(x=>x.id!=o.id);D.costs=D.costs.filter(x=>x.id!=o.id);save();close();render()};
  $('#ok').onclick=()=>{
    const v={};
    for(const[k,,ty]of F){
      const r=$('#f_'+k).value.trim();
      if(ty=='n'){const n=num('f_'+k);if(isNaN(n)||n<0)return toast('Bitte eine Zahl eingeben');v[k]=n}
      else{if(!r)return toast('Bitte ausfüllen');v[k]=r}
    }
    if(kind=='item')o.id?Object.assign(D.items.find(x=>x.id==o.id),v):D.items.push({id:Date.now(),date:today(),...v});
    else o.id?Object.assign(D.costs.find(x=>x.id==o.id),v):D.costs.push({id:Date.now(),t:kind,date:today(),...v});
    save();close();render();
  };
}
function exp(){
  const q=v=>'"'+String(v).replace(/"/g,'""')+'"',n=v=>String(v).replace('.',',');
  const r=['Typ;Name;Einkauf;Verkauf;Gewinn;Betrag;Datum'];
  D.items.forEach(i=>r.push(['Artikel',q(i.name),n(i.buy),n(i.sell),n(i.sell-i.buy),'',i.date].join(';')));
  D.costs.forEach(c=>r.push([c.t=='once'?'Einmalig':'Fixkosten',q(c.name),'','','',n(c.amt),c.date].join(';')));
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob(['\ufeff'+r.join('\n')],{type:'text/csv'}));
  a.download='reselling-backup-'+today()+'.csv';a.click();
}
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-e],[data-c],[data-p],[data-add],[data-x],[data-t],#fab');
  if(!t)return;
  if(t.id=='fab')return modal('item');
  if(t.dataset.t){tab=t.dataset.t;render();return scrollTo(0,0)}
  if(t.dataset.p){per=t.dataset.p;return render()}
  if(t.dataset.add)return modal(t.dataset.add);
  if(t.dataset.x)return exp();
  if(t.dataset.e)return modal('item',D.items.find(x=>x.id==t.dataset.e));
  if(t.dataset.c){const c=D.costs.find(x=>x.id==t.dataset.c);return modal(c.t,c)}
});
(()=>{const c=document.createElement('canvas');c.width=c.height=180;const x=c.getContext('2d');
  x.fillStyle='#0e0e10';x.fillRect(0,0,180,180);x.fillStyle='#c9a86a';
  x.font='100px Georgia,serif';x.textAlign='center';x.textBaseline='middle';x.fillText('€',90,96);
  const l=document.createElement('link');l.rel='apple-touch-icon';l.href=c.toDataURL();document.head.appendChild(l)})();
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
render();
</script>
</body>
</html>
